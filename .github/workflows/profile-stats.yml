name: Update profile statistics

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check private statistics token
        shell: bash
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          if [[ -z "$PROFILE_STATS_TOKEN" ]]; then
            echo "::error title=PROFILE_STATS_TOKEN is not configured::Add the PROFILE_STATS_TOKEN repository secret before running this workflow. It is required to include private repository statistics."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate profile cards
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/generate_profile_stats.py

      - name: Commit updated cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "Profile cards are already up to date."
            exit 0
          fi

          git commit -m "chore: update profile statistics"
          git push
