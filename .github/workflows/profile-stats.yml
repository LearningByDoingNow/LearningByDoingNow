name: Update profile statistics

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check private statistics token
        shell: bash
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          if [[ -z "$PROFILE_STATS_TOKEN" ]]; then
            echo "::warning title=PROFILE_STATS_TOKEN is not configured::Add the PROFILE_STATS_TOKEN repository secret to include private repository statistics. Public statistics will still be generated."
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate GitHub Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=default&hide_border=true&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Top Languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=default&layout=compact&langs_count=5&hide=makefile,cmake
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit updated cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "Profile cards are already up to date."
            exit 0
          fi

          git commit -m "chore: update profile statistics"
          git push
