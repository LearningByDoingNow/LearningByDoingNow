<svg xmlns="http://www.w3.org/2000/svg" width="500" height="205" viewBox="0 0 500 205" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Repository Stats</title>
  <desc id="desc">All commits across all branches of owned non-fork repositories, deduplicated by repository and SHA.</desc>
  <style>
    .title { font: 700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #2f80ed; }
    .label { font: 600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #434d58; }
    .value { font: 700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #434d58; }
    .language { font: 400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #434d58; }
  </style>
  <rect x="1" y="1" width="498" height="203" rx="8" fill="#fffefe" stroke="#e4e2e2" />
  <text x="25" y="36" class="title">GitHub Repository Stats</text><text x="30" y="65" class="label">Repository commits (all branches):</text><text x="370" y="65" class="value">1329</text><text x="30" y="92" class="label">Repositories scanned:</text><text x="370" y="92" class="value">35</text><text x="30" y="119" class="label">Branches scanned:</text><text x="370" y="119" class="value">63</text><text x="30" y="146" class="label">Total stars:</text><text x="370" y="146" class="value">26</text><text x="30" y="173" class="label">Followers:</text><text x="370" y="173" class="value">5</text>
</svg>
