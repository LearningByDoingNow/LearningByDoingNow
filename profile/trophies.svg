<svg xmlns="http://www.w3.org/2000/svg" width="770" height="110" viewBox="0 0 770 110" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Trophies</title>
  <desc id="desc">Achievement ranks derived from stars, commits, pull requests, issues, contributed repositories, followers and owned repositories.</desc>
  <style>
    .title { font: 700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #2f80ed; }
    .label { font: 600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #434d58; }
    .value { font: 700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #434d58; }
    .language { font: 400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #434d58; }
    .grade { font: 700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #434d58; }
    .trophy-label { font: 600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #57606a; }
    .trophy-grade { font: 700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .trophy-value { font: 400 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #6e7781; }
    .icon { fill: none; stroke: #4c71f2; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect x="1" y="1" width="768" height="108" rx="8" fill="#fffefe" stroke="#e4e2e2" />
  <rect x="1" y="1" width="768" height="108" rx="8" fill="#fffefe" stroke="#e4e2e2" /><text x="55" y="32" class="trophy-label" text-anchor="middle">Stars</text><text x="55" y="74" class="trophy-grade" text-anchor="middle" style="fill:#6e7781">C+</text><text x="55" y="96" class="trophy-value" text-anchor="middle">30 stars</text><line x1="110" y1="16" x2="110" y2="94" stroke="#eeecec" /><text x="165" y="32" class="trophy-label" text-anchor="middle">Commits</text><text x="165" y="74" class="trophy-grade" text-anchor="middle" style="fill:#e74c3c">SS</text><text x="165" y="96" class="trophy-value" text-anchor="middle">19094 commits</text><line x1="220" y1="16" x2="220" y2="94" stroke="#eeecec" /><text x="275" y="32" class="trophy-label" text-anchor="middle">Pull Requests</text><text x="275" y="74" class="trophy-grade" text-anchor="middle" style="fill:#2f80ed">B+</text><text x="275" y="96" class="trophy-value" text-anchor="middle">64 PRs</text><line x1="330" y1="16" x2="330" y2="94" stroke="#eeecec" /><text x="385" y="32" class="trophy-label" text-anchor="middle">Issues</text><text x="385" y="74" class="trophy-grade" text-anchor="middle" style="fill:#8b949e">C</text><text x="385" y="96" class="trophy-value" text-anchor="middle">3 issues</text><line x1="440" y1="16" x2="440" y2="94" stroke="#eeecec" /><text x="495" y="32" class="trophy-label" text-anchor="middle">Contributed</text><text x="495" y="74" class="trophy-grade" text-anchor="middle" style="fill:#6e7781">C+</text><text x="495" y="96" class="trophy-value" text-anchor="middle">4 repos</text><line x1="550" y1="16" x2="550" y2="94" stroke="#eeecec" /><text x="605" y="32" class="trophy-label" text-anchor="middle">Followers</text><text x="605" y="74" class="trophy-grade" text-anchor="middle" style="fill:#8b949e">C</text><text x="605" y="96" class="trophy-value" text-anchor="middle">5 followers</text><line x1="660" y1="16" x2="660" y2="94" stroke="#eeecec" /><text x="715" y="32" class="trophy-label" text-anchor="middle">Repositories</text><text x="715" y="74" class="trophy-grade" text-anchor="middle" style="fill:#9b59b6">B</text><text x="715" y="96" class="trophy-value" text-anchor="middle">40 repos</text>
</svg>
